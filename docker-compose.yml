services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false   # every agent has an offline fallback; keys only add depth
    volumes:
      - ./data:/srv/rakshak/data   # blocklist + community reports persist across restarts
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
